<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>aayu</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="aayu">
<meta name="application-name" content="aayu">
<meta name="theme-color" content="#0b6e5a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<style>
  /* Locked entry page: the app itself is stored encrypted below and opened in the browser with the password. */
  :root { --bg: #eef3f1; --surface: #ffffff; --ink: #13231f; --muted: #5b6d68; --line: #cfdcd8; --accent: #0b6e5a; --accent-ink: #ffffff; --bad: #b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1614; --surface: #15211e; --ink: #e6efec; --muted: #9bb0aa; --line: #2a3a36; --accent: #3fc3a2; --accent-ink: #062019; --bad: #ff8a80; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--ink);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  form {
    width: min(360px, 100%); display: grid; gap: 12px; padding: 24px 20px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px; text-align: center;
  }
  img { width: 72px; height: 72px; border-radius: 16px; margin: 0 auto; }
  h1 { margin: 0; font-size: 1.3rem; }
  input[type="password"] {
    width: 100%; min-height: 48px; padding: 8px 12px; font: inherit; font-size: 1.05rem;
    border: 2px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink);
  }
  input[type="password"]:focus { outline: none; border-color: var(--accent); }
  label { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.9rem; color: var(--muted); }
  label input { width: 20px; height: 20px; accent-color: var(--accent); }
  button {
    min-height: 48px; border: 0; border-radius: 12px; font: inherit; font-size: 1.05rem; font-weight: 600;
    background: var(--accent); color: var(--accent-ink); cursor: pointer;
  }
  button:disabled { opacity: 0.6; }
  .msg { margin: 0; min-height: 1.4em; font-size: 0.9rem; color: var(--bad); }
</style>
</head>
<body>
<form id="unlock" autocomplete="on" hidden>
  <img src="icons/apple-touch-icon.png" alt="">
  <h1>aayu</h1>
  <input type="text" name="username" value="aayu" autocomplete="username" hidden>
  <input id="pw" type="password" name="password" autocomplete="current-password" placeholder="Contraseña" aria-label="Contraseña" required>
  <label><input id="remember" type="checkbox" checked> Recordar en este dispositivo</label>
  <button id="go" type="submit">Abrir</button>
  <p class="msg" id="msg" aria-live="polite"></p>
</form>

  var form = document.getElementById("unlock"), pw = document.getElementById("pw"),

  function bytes(b64) { var s = atob(b64), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }
  function b64(buf) { var a = new Uint8Array(buf), s = ""; for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }
